<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - Mi Tienda</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
<header>
    <div class="logo">MiTienda</div>
    <nav>
        <a href="index.html">Home</a>
        <a href="productos.html">Productos</a>
        <a href="contacto.html">Contacto</a>
        <a href="login.html">Iniciar Sesión</a>
        <a href="registro.html">Registrarse</a>
    </nav>
    <a href="carrito.html" class="cart-icon">🛒 Cart (<span id="cant-carrito">0</span>)</a>
</header>

<div class="container">
    <h2>Iniciar Sesión</h2>
    <form onsubmit="validarLogin(event)">
        <div class="form-group">
            <label for="correo">Correo Electrónico:</label>
            <input type="text" id="correo" placeholder="ejemplo@duoc.cl">
            <span id="errorCorreo" class="error-message"></span>
        </div>

        <div class="form-group">
            <label for="password">Contraseña:</label>
            <input type="password" id="password">
            <span id="errorPassword" class="error-message"></span>
        </div>

        <button type="submit" class="btn">Iniciar Sesión</button>
    </form>
</div>

<footer>
    <p>&copy; 2026 LogiStock - Evaluación Parcial 1</p>
</footer>

<script src="js/productos.js"></script>
<script src="js/validaciones.js"></script>

</body>
</html>
