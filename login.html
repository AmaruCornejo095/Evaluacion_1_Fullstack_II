<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - LogiStock</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
<header>
    <div class="logo">LogiStock</div>
    <nav>
        <a href="index.html">Home</a>
        <a href="productos.html">Productos</a>
        <a href="nosotros.html">Nosotros</a>
        <a href="blogs.html">Blogs</a>
        <a href="contacto.html">Contacto</a>
    </nav>

    <div class="header-right">
        <a href="login.html" class="nav-auth">Iniciar Sesión</a>
        <a href="registro.html" class="nav-auth">Registrarse</a>
        <a href="carrito.html" class="cart-link">🛒 Cart (<span id="cant-carrito">0</span>)</a>
    </div>
</header>

<main class="container form-page">
    <div class="form-card">
        <div class="form-header">
            <h2>Iniciar Sesión</h2>
            <p>Ingresa tu correo y contraseña para acceder a tu cuenta.</p>
        </div>

        <form id="formLogin" onsubmit="validarLogin(event)" novalidate>
            <div class="form-group">
                <label for="correo">Correo Electrónico *</label>
                <input type="text" id="correo" name="correo" placeholder="ejemplo@duoc.cl" maxlength="100" required>
                <span id="errorCorreo" class="error-message"></span>
            </div>

            <div class="form-group">
                <label for="password">Contraseña *</label>
                <input type="password" id="password" name="password" placeholder="Entre 4 y 10 caracteres" maxlength="10" required>
                <span id="errorPassword" class="error-message"></span>
            </div>

            <button type="submit" class="btn btn-full">Iniciar Sesión</button>
        </form>

        <p class="form-link">¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
    </div>
</main>

<footer>
    <p>&copy; 2026 LogiStock - Evaluación Parcial 1</p>
</footer>

<script src="js/productos.js"></script>
<script src="js/validaciones.js"></script>

</body>
</html>
