<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario - LogiStock</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
<header>
    <div class="logo">LogiStock</div>
    <nav>
        <a href="index.html">Home</a>
        <a href="productos.html">Productos</a>
        <a href="nosotros.html">Nosotros</a>
        <a href="blogs.html">Blogs</a>
        <a href="contacto.html">Contacto</a>
    </nav>

    <div class="header-right">
        <a href="login.html" class="nav-auth">Iniciar Sesión</a>
        <a href="registro.html" class="nav-auth">Registrarse</a>
        <a href="carrito.html" class="cart-link">🛒 Cart (<span id="cant-carrito">0</span>)</a>
    </div>
</header>

<main class="container form-page">
    <div class="form-card">
        <div class="form-header">
            <h2>Registro de Usuario</h2>
            <p>Crea tu cuenta para comprar y seguir tus pedidos.</p>
        </div>

        <form id="formRegistro" onsubmit="validarRegistroUsuario(event)" novalidate>
            <div class="form-group">
                <label for="run">RUN (Sin puntos ni guion) *</label>
                <input type="text" id="run" name="run" placeholder="19011022K" maxlength="9" required>
                <span id="errorRun" class="error-message"></span>
            </div>

            <div class="form-group">
                <label for="nombre">Nombre *</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ej: Juan" maxlength="50" required>
                <span id="errorNombre" class="error-message"></span>
            </div>

            <div class="form-group">
                <label for="apellidos">Apellidos *</label>
                <input type="text" id="apellidos" name="apellidos" placeholder="Ej: Pérez González" maxlength="100" required>
                <span id="errorApellidos" class="error-message"></span>
            </div>

            <div class="form-group">
                <label for="correo">Correo Electrónico *</label>
                <input type="text" id="correo" name="correo" placeholder="ejemplo@duoc.cl" maxlength="100" required>
                <span id="errorCorreo" class="error-message"></span>
            </div>

            <div class="form-group">
                <label for="password">Contraseña *</label>
                <input type="password" id="password" name="password" placeholder="Entre 4 y 10 caracteres" maxlength="10" required>
                <span id="errorPassword" class="error-message"></span>
            </div>

            <div class="form-group">
                <label for="confirmar">Confirmar Contraseña *</label>
                <input type="password" id="confirmar" name="confirmar" placeholder="Repite tu contraseña" maxlength="10" required>
                <span id="errorConfirmar" class="error-message"></span>
            </div>

            <button type="submit" class="btn btn-full">Registrar</button>
        </form>

        <p class="form-link">¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a></p>
    </div>
</main>

<footer>
    <p>&copy; 2026 LogiStock - Evaluación Parcial 1</p>
</footer>

<script src="js/productos.js"></script>
<script src="js/validaciones.js"></script>

</body>
</html>
