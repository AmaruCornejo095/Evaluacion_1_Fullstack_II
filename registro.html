<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registro de Usuario - Mi Tienda</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
<header>
    <div class="logo">MiTienda</div>
    <nav>
        <a href="index.html">Home</a>
        <a href="login.html">Iniciar Sesión</a>
    </nav>
    <a href="carrito.html" class="cart-icon">🛒 Cart (<span id="cant-carrito">0</span>)</a>
</header>

<div class="container">
    <h2>Registro de Usuario</h2>
    <form onsubmit="validarRegistroUsuario(event)">
        <div class="form-group">
            <label for="run">RUN (Sin puntos ni guion):</label>
            <input type="text" id="run" placeholder="19011022K">
        </div>
        <div class="form-group">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre">
        </div>
        <div class="form-group">
            <label for="apellidos">Apellidos:</label>
            <input type="text" id="apellidos">
        </div>
        <div class="form-group">
            <label for="correo">Correo Electrónico:</label>
            <input type="text" id="correo">
        </div>
        <button type="submit" class="btn">Registrar</button>
    </form>
</div>

<script src="js/productos.js"></script>
<script src="js/validaciones.js"></script>

</body>
</html>
